[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "sic8-anti-fraud-lakehouse"
version = "0.2.0"
description = "Real-Time Payment Ingestion & Anti-Fraud Lakehouse Engineering Monorepo"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.15",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pyarrow>=15.0.0",
    "boto3>=1.34.0",
    "joblib>=1.3.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.6",
]
spark = [
    "pyspark>=3.5,<4",
    "delta-spark>=3.2,<4",
]
kafka = [
    "confluent-kafka>=2.2.0",
    "kafka-python>=2.0.2",
]
all = [
    "sic8-anti-fraud-lakehouse[dev,spark,kafka]",
]

[tool.setuptools.packages.find]
include = ["src*", "apps*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring external services or integration harness",
    "live_aws: marks tests probing live AWS resources",
    "slow: marks tests that take a long time to run",
    "benchmark: marks benchmark tests",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]  # CI safety errors
